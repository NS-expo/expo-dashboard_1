<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>2パネル表示</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#000; width:100vw; height:100vh; }
  .dashboard-grid { display:grid; grid-template-columns: repeat(2, 1fr); grid-template-rows: 1fr; width:100vw; height:100vh; }
  .panel { border:none; overflow:hidden; width:100%; height:100%; }
  .panel iframe { width:100%; height:100%; border:none; display:block; }
</style>
</head>
<body>
  <div class="dashboard-grid" id="grid"></div>
  <script>
    const params = new URLSearchParams(location.search);
    const set = params.get('set') || '1';

    // モニタごとに表示する2ページの組み合わせをここで定義
    const pageSets = {
      '1': ['dashboard', 'control'],
      '2': ['anomaly', 'quiz']
    };

    const pages = pageSets[set] || pageSets['1'];
    const grid = document.getElementById('grid');

    pages.forEach(page => {
      const panel = document.createElement('div');
      panel.className = 'panel';
      const iframe = document.createElement('iframe');
      iframe.src = `https://regal-granita-2ce3c9.netlify.app//?page=${page}`;
      panel.appendChild(iframe);
      grid.appendChild(panel);
    });
  </script>
</body>
</html>
